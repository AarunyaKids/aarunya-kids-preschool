services:
  - type: web
    name: aarunya-kids-preschool
    runtime: node
    plan: starter            # persistent disks need a paid plan on Render
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: aarunya-data
      mountPath: /var/data
      sizeGB: 1
